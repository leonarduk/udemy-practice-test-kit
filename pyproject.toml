[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udemy-practice-test-kit"
# Single source of truth: ptkit.__version__ (src/ptkit/__init__.py). See
# README "Versioning" for when to bump it.
dynamic = ["version"]
description = "Shared tooling for Udemy practice-test question banks: master-Markdown parser, bulk-upload CSV projection, and item-quality validation."
readme = "README.md"
requires-python = ">=3.11"
# Deliberately zero runtime dependencies. The adopting course repos advertise
# "pure stdlib, nothing to install" and the only thing this package adds to a
# clone is itself; tomllib (course.toml) is stdlib from 3.11.
dependencies = []

[project.scripts]
ptkit = "ptkit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ptkit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptkit = ["scaffold/*", "scaffold/**/*"]
